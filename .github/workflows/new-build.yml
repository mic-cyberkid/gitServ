name: API Test (Windows)

on: [push, pull_request]

jobs:
  test-api:
    runs-on: windows-latest          # <-- Windows runner
    defaults:
      run:
        shell: pwsh                 # PowerShell Core (cross‑platform)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx

      # ---------------------------------------------------------
      # 1. Start the server in the background (PowerShell Start‑Process)
      # ---------------------------------------------------------
      - name: Start FastAPI server (background)
        run: |
          $proc = Start-Process -FilePath "python" `
                                -ArgumentList "-m", "uvicorn", "main:app", `
                                              "--host", "0.0.0.0", "--port", "8000" `
                                -PassThru -NoNewWindow
          # Save the PID so we can kill it later (optional)
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Write-Host "Server PID: $($proc.Id) – listening on http://localhost:8000"

      # ---------------------------------------------------------
      # 2. Wait until /health returns {"status":"ok"}
      # ---------------------------------------------------------
      - name: Wait for server to be healthy
        run: |
          $timeout = 30
          $elapsed = 0
          $step    = 2

          while ($elapsed -lt $timeout) {
            try {
              $resp = Invoke-WebRequest -Uri http://localhost:8000/health -UseBasicParsing -ErrorAction Stop
              $json = $resp.Content | ConvertFrom-Json
              if ($json.status -eq "ok") {
                Write-Host "Server is healthy!"
                exit 0
              }
            } catch { }
            Write-Host "Waiting for server... ($elapsed s)"
            Start-Sleep -Seconds $step
            $elapsed += $step
          }
          Write-Error "Server did not become healthy within $timeout seconds"
          exit 1

      # ---------------------------------------------------------
      # 3. Run the tests
      # ---------------------------------------------------------
      - name: Run API tests
        run: python client.py

      # ---------------------------------------------------------
      # (Optional) Clean‑up – kill the background server
      # ---------------------------------------------------------
      - name: Stop background server
        if: always()
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
            Write-Host "Stopped server (PID $env:SERVER_PID)"
          }
