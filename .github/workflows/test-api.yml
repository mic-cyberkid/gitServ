name: Test FastAPI with Pinggy.io (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server
        id: server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "python" -ArgumentList "server.py" -PassThru -NoNewWindow
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Write-Host "FastAPI PID: $($proc.Id)"
          Start-Sleep -Seconds 5  # Wait for uvicorn to bind

      - name: Start Pinggy tunnel and extract URL
        shell: pwsh
        run: |
          # Clear old logs
          Remove-Item "pinggy.log", "pinggy_err.log" -ErrorAction SilentlyContinue

          # Start Pinggy: forward local 8000 to public HTTPS (port 443 for secure connection)
          $sshArgs = @('-p', '443', '-R0:127.0.0.1:8000', '-L4300:127.0.0.1:4300', 'qr@a.pinggy.io')
          $tunnelProc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs -PassThru -NoNewWindow -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log"

          # Wait and poll logs for URL (Pinggy prints it like "https://abc123.pinggy.io")
          $maxAttempts = 30
          $attempt = 0
          $publicUrl = $null

          while ($attempt -lt $maxAttempts -and (-not $publicUrl)) {
            $attempt++
            Start-Sleep -Seconds 1

            # Check stdout
            if (Test-Path "pinggy.log") {
              $log = Get-Content "pinggy.log" -Raw -ErrorAction SilentlyContinue
              if ($log -match 'https://([a-z0-9-]+\.pinggy\.io)') {
                $publicUrl = $matches[0]
                break
              }
            }

            # Check stderr
            if (Test-Path "pinggy_err.log") {
              $err = Get-Content "pinggy_err.log" -Raw -ErrorAction SilentlyContinue
              if ($err -match 'https://([a-z0-9-]+\.pinggy\.io)') {
                $publicUrl = $matches[0]
                break
              }
            }
          }

          if (-not $publicUrl) {
            $logOut = Get-Content "pinggy.log" -Raw -ErrorAction SilentlyContinue
            $errOut = Get-Content "pinggy_err.log" -Raw -ErrorAction SilentlyContinue
            Write-Error "Failed to get Pinggy URL. stdout: $logOut stderr: $errOut"
            exit 1
          }

          echo "PINGGY_URL=$publicUrl" >> $env:GITHUB_ENV
          Write-Host "Pinggy URL: $publicUrl"

      - name: Run client
        env:
          PINGGY_URL: ${{ env.PINGGY_URL }}
        run: python client.py

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "ssh" -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item "pinggy.log", "pinggy_err.log" -ErrorAction SilentlyContinue
