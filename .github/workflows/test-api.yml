name: Test FastAPI with Serveo.net (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server
        id: server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "python" -ArgumentList "server.py" -PassThru -NoNewWindow
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Write-Host "FastAPI PID: $($proc.Id)"
          Start-Sleep -Seconds 5  # Wait for uvicorn to bind

      - name: Start Serveo tunnel and get public URL
        shell: pwsh
        run: |
          # Start Serveo in background (random subdomain, forward to port 8000)
          $sshArgs = @('-R', '80:localhost:8000', 'serveo.net')
          $tunnelProc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs -PassThru -NoNewWindow -RedirectStandardOutput "serveo.log" -RedirectStandardError "serveo_err.log"

          # Poll the log file for the public URL (Serveo prints it like "Forwarding HTTP traffic from https://abc123.serveo.net")
          $maxAttempts = 30
          $attempt = 0
          $publicUrl = $null

          while ($attempt -lt $maxAttempts -and -not $publicUrl) {
            $attempt++
            Start-Sleep -Seconds 1
            if (Test-Path "serveo.log") {
              $logContent = Get-Content "serveo.log" -Raw
              if ($logContent -match 'https://([a-z0-9-]+\.serveo\.net)') {
                $publicUrl = $matches[0]
              }
            }
            # Also check stderr in case of output there
            if (Test-Path "serveo_err.log" -and -not $publicUrl) {
              $errContent = Get-Content "serveo_err.log" -Raw
              if ($errContent -match 'https://([a-z0-9-]+\.serveo\.net)') {
                $publicUrl = $matches[0]
              }
            }
          }

          if (-not $publicUrl) {
            Write-Error "Failed to get Serveo URL after $maxAttempts attempts. Log: $(Get-Content serveo.log -Raw). Err: $(Get-Content serveo_err.log -Raw)"
            exit 1
          }

          echo "SERVEO_URL=$publicUrl" >> $env:GITHUB_ENV
          Write-Host "Serveo URL: $publicUrl"

      - name: Run client
        env:
          SERVEO_URL: ${{ env.SERVEO_URL }}
        run: python client.py

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "ssh" -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item "serveo.log", "serveo_err.log" -ErrorAction SilentlyContinue
