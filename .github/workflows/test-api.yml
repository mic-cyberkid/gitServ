name: Test FastAPI with ngrok (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download ngrok
        shell: pwsh
        run: |
          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile ngrok.zip -UseBasicParsing

      - name: Extract ngrok
        shell: pwsh
        run: |
          Expand-Archive -Path ngrok.zip -DestinationPath . -Force
          if (-not (Test-Path "ngrok.exe")) { exit 1 }

      - name: Authenticate ngrok
        shell: pwsh
        run: |
          .\ngrok.exe authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Start FastAPI server
        id: server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "python" -ArgumentList "server.py" -PassThru -NoNewWindow
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Write-Host "FastAPI PID: $($proc.Id)"
          Start-Sleep -Seconds 5  # Wait for uvicorn to bind

      - name: Start ngrok and get public URL
        shell: pwsh
        run: |
          # Start ngrok in background
          $ngrok = Start-Process -FilePath ".\ngrok.exe" -ArgumentList "http","8000","--log=stdout" -PassThru -NoNewWindow

          # Poll ngrok API until tunnel is ready
          $maxAttempts = 30
          $attempt = 0
          $publicUrl = $null

          while ($attempt -lt $maxAttempts -and -not $publicUrl) {
            $attempt++
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-RestMethod "http://localhost:4040/api/tunnels" -TimeoutSec 5
              $publicUrl = $resp.tunnels[0].public_url
            } catch {
              # Ignore errors during startup
            }
          }

          if (-not $publicUrl) {
            Write-Error "Failed to get ngrok URL after $maxAttempts attempts"
            exit 1
          }

          echo "NGROK_URL=$publicUrl" >> $env:GITHUB_ENV
          Write-Host "ngrok URL: $publicUrl"

      - name: Run client
        env:
          NGROK_URL: ${{ env.NGROK_URL }}
        run: python client.py

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
