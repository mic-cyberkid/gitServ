name: Test FastAPI with Pinggy.io (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server
        id: server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "python" -ArgumentList "server.py" -PassThru -NoNewWindow
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Write-Host "FastAPI PID: $($proc.Id)"
          Start-Sleep -Seconds 5  # Wait for uvicorn to bind

      - name: Start Pinggy tunnel and extract URL
        shell: pwsh
        run: |
          # SSH args for non-interactive tunnel (no TTY, no host key prompts)
          $sshArgs = @('-T', '-p', '443', '-R0:localhost:8000', '-o', 'StrictHostKeyChecking=no', '-o', 'UserKnownHostsFile=NUL', 'free.pinggy.io')

          # Run SSH in background (&) and capture output to variable (streams console output)
          $output = ssh $sshArgs 2>$null | Out-String

          # Wait a bit for output to generate, then parse for HTTPS URL
          Start-Sleep -Seconds 3
          $publicUrl = $null

          # Extract HTTPS URL from output (Pinggy format: https://random.pinggy.link)
          if ($output -match 'https://([a-z0-9-]+\.pinggy\..+)') {
            $publicUrl = $matches[0]
          }

          if (-not $publicUrl) {
            Write-Error "Failed to get Pinggy URL. Output: $output"
            exit 1
          }

          echo "PINGGY_URL=$publicUrl" >> $env:GITHUB_ENV
          Write-Host "Pinggy URL: $publicUrl"

      - name: Run client
        env:
          PINGGY_URL: ${{ env.PINGGY_URL }}
        run: python client.py

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "ssh" -ErrorAction SilentlyContinue | Stop-Process -Force
