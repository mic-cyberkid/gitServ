name: Test FastAPI with Serveo.net (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server
        id: server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "python" -ArgumentList "server.py" -PassThru -NoNewWindow
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Write-Host "FastAPI PID: $($proc.Id)"
          Start-Sleep -Seconds 5

      - name: Start Serveo tunnel and extract URL
        shell: pwsh
        run: |
          # Clear old logs
          Remove-Item "serveo.log", "serveo_err.log" -ErrorAction SilentlyContinue

          # Start Serveo: forward local 8000 to public HTTPS
          $sshArgs = "-R", "80:localhost:8000", "serveo.net"
          $tunnelProc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs -PassThru -NoNewWindow -RedirectStandardOutput "serveo.log" -RedirectStandardError "serveo_err.log"

          # Wait and poll logs for URL
          $maxAttempts = 30
          $attempt = 0
          $publicUrl = $null

          while ($attempt -lt $maxAttempts -and (-not $publicUrl)) {
            $attempt++
            Start-Sleep -Seconds 1

            # Check stdout
            if (Test-Path "serveo.log") {
              $log = Get-Content "serveo.log" -Raw -ErrorAction SilentlyContinue
              if ($log -match 'https://([a-z0-9-]+\.serveo\.net)') {
                $publicUrl = $matches[0]
                break
              }
            }

            # Check stderr
            if (Test-Path "serveo_err.log") {
              $err = Get-Content "serveo_err.log" -Raw -ErrorAction SilentlyContinue
              if ($err -match 'https://([a-z0-9-]+\.serveo\.net)') {
                $publicUrl = $matches[0]
                break
              }
            }
          }

          if (-not $publicUrl) {
            $logOut = Get-Content "serveo.log" -Raw -ErrorAction SilentlyContinue
            $errOut = Get-Content "serveo_err.log" -Raw -ErrorAction SilentlyContinue
            Write-Error "Failed to get Serveo URL. stdout: $logOut stderr: $errOut"
            exit 1
          }

          echo "SERVEO_URL=$publicUrl" >> $env:GITHUB_ENV
          Write-Host "Serveo URL: $publicUrl"

      - name: Run client
        env:
          SERVEO_URL: ${{ env.SERVEO_URL }}
        run: python client.py

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "ssh" -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item "serveo.log", "serveo_err.log" -ErrorAction SilentlyContinue
