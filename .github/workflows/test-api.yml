name: Test FastAPI with ngrok (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download ngrok
        shell: pwsh
        run: |
          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile ngrok.zip -UseBasicParsing

      - name: Extract ngrok
        shell: pwsh
        run: |
          Expand-Archive -Path ngrok.zip -DestinationPath . -Force
          if (-not (Test-Path "ngrok.exe")) { exit 1 }

      - name: Authenticate ngrok
        shell: pwsh
        run: |
          .\ngrok.exe authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Start FastAPI server
        id: server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "python" -ArgumentList "server.py" -PassThru -NoNewWindow
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Write-Host "FastAPI PID: $($proc.Id)"
          Start-Sleep -Seconds 5  # Wait for uvicorn to bind

      - name: Start ngrok and get URL
        shell: pwsh
        run: |
         $ngrok = Start-Process -FilePath ".\ngrok.exe" -ArgumentList "http","8000","--log=stdout" -PassThru -NoNewWindow
         Start-Sleep -Seconds 8
         $tunnels = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
         $url = $tunnels.tunnels[0].public_url
         echo "NGROK_URL=$url" >> $env:GITHUB_ENV
         Write-Host "ngrok URL: $url"

      - name: Run client
        env:
          NGROK_URL: ${{ env.NGROK_URL }}
        run: |
            Start-Sleep -Seconds 90
            python client.py
            

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
